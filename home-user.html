<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaCheck — ユーザー用ホーム画面</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #10340f;
    --accent: #2a6e27;
    --accent-light: #e8f5e8;
    --text: #1a1a1a;
    --dim: #666;
    --dimmer: #aaa;
    --border: #e8e8e8;
    --card-bg: #fafafa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: var(--text); font-family: 'Outfit', 'Noto Sans JP', sans-serif; min-height: 100vh; }

  nav {
    position: sticky; top: 0; z-index: 100;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-brand { font-size: 17px; font-weight: 600; color: var(--green); text-decoration: none; }
  .nav-brand span { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .lang-switcher { display: flex; gap: 2px; }
  .lang-btn { font-size: 10px; color: var(--dimmer); background: none; border: none; padding: 4px 7px; border-radius: 6px; cursor: pointer; font-family: 'Outfit', sans-serif; }
  .lang-btn.active { color: var(--accent); background: var(--accent-light); }
  .nav-login { font-size: 13px; color: var(--dim); text-decoration: none; padding: 7px 14px; border: 1px solid var(--border); border-radius: 100px; }

  .hero { padding: 40px 20px 32px; border-bottom: 1px solid var(--border); }
  .hero-badge { display: inline-block; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(42,110,39,0.25); border-radius: 100px; padding: 3px 10px; margin-bottom: 16px; background: var(--accent-light); }
  .hero-title { font-size: 26px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.25; margin-bottom: 8px; color: var(--green); }
  .hero-title em { font-style: normal; color: var(--accent); }
  .hero-sub { font-size: 12px; color: var(--dim); font-weight: 300; }

  .logged-in-banner { margin: 16px 20px 0; background: var(--accent-light); border: 1px solid rgba(42,110,39,0.2); border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .logged-in-banner .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .logged-in-banner .text { font-size: 12px; color: var(--dim); }
  .logged-in-banner .text strong { color: var(--green); }

  .section-label { padding: 24px 20px 10px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dimmer); }

  .categories { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
  .cat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px 16px; text-decoration: none; color: var(--text); display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; }
  .cat-card:hover:not(.disabled) { background: #fff; border-color: var(--accent); box-shadow: 0 2px 12px rgba(42,110,39,0.08); }
  .cat-card.disabled { opacity: 0.45; cursor: default; pointer-events: none; }
  .cat-left { display: flex; align-items: center; gap: 14px; }
  .cat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cat-icon svg { width: 18px; height: 18px; }
  .icon-learn { background: #e8f5e8; }
  .icon-result { background: #e8eeff; }
  .icon-order { background: #fff8e8; }
  .icon-shop { background: #ffe8e8; }
  .icon-expert { background: #f0e8ff; }
  .cat-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .cat-desc { font-size: 11px; color: var(--dim); font-weight: 300; }
  .cat-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .cat-tag { font-size: 9px; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
  .tag-member { background: #e8eeff; color: #4466cc; border: 1px solid #ccd4ff; }
  .tag-coming { background: #f5f5f5; color: var(--dimmer); border: 1px solid var(--border); }
  .cat-arrow { font-size: 18px; color: var(--dimmer); }

  .register-banner { margin: 24px 20px; background: var(--green); border-radius: 14px; padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .register-banner-text strong { color: #fff; font-weight: 600; display: block; margin-bottom: 2px; font-size: 14px; }
  .register-banner-text span { font-size: 11px; color: rgba(255,255,255,0.6); font-style: italic; }
  .register-banner-btn { font-size: 13px; font-weight: 600; color: var(--green); background: #7dd87a; padding: 10px 18px; border-radius: 100px; text-decoration: none; white-space: nowrap; flex-shrink: 0; }

  footer { padding: 24px 20px; border-top: 1px solid var(--border); text-align: center; }
  .footer-brand { font-size: 14px; font-weight: 600; color: var(--green); margin-bottom: 6px; }
  .footer-brand span { color: var(--accent); }
  .footer-op { font-size: 10px; color: var(--dimmer); }

  .hidden { display: none !important; }
  @keyframes slideInLeft {
    0% { transform: translateX(-120%); opacity: 0; }
    60% { transform: translateX(6px); opacity: 1; }
    80% { transform: translateX(-2px); }
    100% { transform: translateX(0); opacity: 1; }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }
  .page-title {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 8px 24px 8px 20px;
    margin-left: -20px;
    margin-bottom: 20px;
    border-radius: 0 100px 100px 0;
    font-family: "Outfit", sans-serif;
    box-shadow: 3px 3px 16px rgba(16,52,15,0.18);
    animation: slideInLeft 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .page-title::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7dd87a;
    flex-shrink: 0;
    animation: pulseDot 2s ease-in-out infinite;
    animation-delay: 0.8s;
  }

  /* PC表示 */
  @media (min-width: 768px) {
    body { background: #f5f5f5; }
    nav { padding: 16px 40px; max-width: 100%; }
    .nav-brand { font-size: 20px; }

    .hero { padding: 60px 40px 48px; max-width: 1100px; margin: 0 auto; }
    .hero-title { font-size: 42px; }
    .hero-sub { font-size: 14px; }

    .logged-in-banner { max-width: 1100px; margin: 24px auto 0; }

    .section-label { max-width: 1100px; margin: 0 auto; padding: 32px 40px 12px; }

    .categories { max-width: 1100px; margin: 0 auto; padding: 0 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .cat-card { border-radius: 16px; padding: 22px 20px; }
    .cat-title { font-size: 15px; }
    .cat-desc { font-size: 12px; }

    .register-banner { max-width: 1100px; margin: 24px auto; padding: 28px 40px; border-radius: 16px; }
    .register-banner-text strong { font-size: 18px; }

    footer { padding: 32px 40px; }
    .footer-brand { font-size: 16px; }
  }

  @media (min-width: 1200px) {
    .categories { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>

<script>
const SUPABASE_URL = 'https://fmpetihjnsuogbvnfauc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtcGV0aWhqbnN1b2didm5mYXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNTcyMDEsImV4cCI6MjA4NjkzMzIwMX0.OALF9p7TWQBPvoqE-E15wgBLKRVFSrc6S21mfrwVMk0';

async function getSession() {
  // あらゆるキー名パターンを試す
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key) continue;
    // supabase関連のキーを全部試す
    if (key.includes('auth') || key.includes('supabase') || key.includes('token') || key.includes('sb-')) {
      try {
        const raw = localStorage.getItem(key);
        const v = JSON.parse(raw);
        if (v && v.access_token) return v;
        // ネストされている場合
        if (v && v.currentSession && v.currentSession.access_token) return v.currentSession;
      } catch(e) {}
    }
  }
  // sessionStorageも確認
  for (let i = 0; i < sessionStorage.length; i++) {
    const key = sessionStorage.key(i);
    if (!key) continue;
    try {
      const v = JSON.parse(sessionStorage.getItem(key));
      if (v && v.access_token) return v;
    } catch(e) {}
  }
  return null;
}

async function verifyToken(token) {
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token } });
    return res.ok ? await res.json() : null;
  } catch(e) { return null; }
}

const T = {
  ja: { pageTitle:'ユーザー用ホーム画面', login:'ログイン', loggedIn:'<strong>ログイン中</strong> — 全カテゴリが利用可能です', title:'代謝を知れば、<br><em>自分が変わる。</em>', sub:'Metabolic Intelligence Platform', catLabel:'カテゴリ', c1title:'代謝について学ぶ', c1desc:'代謝の傾向・生活習慣・最新知見', c2title:'自分の代謝を見る', c2desc:'解析結果・スコア・経時変化', c3title:'解析を依頼する', c3desc:'キット申し込み・検体採取', c4title:'商品を探す', c4desc:'食品・サプリ・化粧品', c5title:'専門家に相談する', c5desc:'提携クリニック・医師・栄養士', member:'会員限定', coming:'準備中', bannerTitle:'自分の代謝を、記録に残す。', bannerDesc:'', bannerBtn:'登録する' },
  en: { pageTitle:'User Home Screen', login:'Login', loggedIn:'<strong>Logged in</strong> — All categories available', title:'Know your metabolism.<br><em>Change your life.</em>', sub:'Metabolic Intelligence Platform', catLabel:'Categories', c1title:'Learn about metabolism', c1desc:'Trends, lifestyle & latest insights', c2title:'View my metabolism', c2desc:'Results, scores & trends over time', c3title:'Request analysis', c3desc:'Kit order & sample collection', c4title:'Browse products', c4desc:'Food, supplements & cosmetics', c5title:'Consult an expert', c5desc:'Partner clinics, doctors & nutritionists', member:'Members only', coming:'Coming soon', bannerTitle:'Your metabolism, on record.', bannerDesc:'', bannerBtn:'Sign up' },
  vi: { pageTitle:'Màn hình trang chủ người dùng', login:'Đăng nhập', loggedIn:'<strong>Đã đăng nhập</strong>', title:'Hiểu chuyển hóa,<br><em>thay đổi bản thân.</em>', sub:'Nền tảng Thông minh Chuyển hóa', catLabel:'Danh mục', c1title:'Tìm hiểu chuyển hóa', c1desc:'Xu hướng, lối sống & kiến thức mới', c2title:'Xem chuyển hóa của tôi', c2desc:'Kết quả, điểm số & thay đổi', c3title:'Yêu cầu phân tích', c3desc:'Đặt kit & thu thập mẫu', c4title:'Tìm sản phẩm', c4desc:'Thực phẩm, bổ sung & mỹ phẩm', c5title:'Tư vấn chuyên gia', c5desc:'Phòng khám, bác sĩ & chuyên gia', member:'Thành viên', coming:'Sắp ra mắt', bannerTitle:'Lưu lại hồ sơ chuyển hóa.', bannerDesc:'', bannerBtn:'Đăng ký' },
  zh: { pageTitle:'用户主页面', login:'登录', loggedIn:'<strong>已登录</strong>', title:'了解代谢，<br><em>改变自己。</em>', sub:'代谢智能平台', catLabel:'类别', c1title:'了解代谢', c1desc:'代谢趋势・生活习惯・最新知识', c2title:'查看我的代谢', c2desc:'分析结果・评分・时间变化', c3title:'申请分析', c3desc:'套件申请・样本采集', c4title:'浏览商品', c4desc:'食品・保健品・化妆品', c5title:'咨询专家', c5desc:'合作诊所・医生・营养师', member:'会员专属', coming:'即将推出', bannerTitle:'记录你的代谢数据。', bannerDesc:'', bannerBtn:'注册' }
};

function setLang(lang) {
  const t = T[lang];
  // localStorage に保存
  localStorage.setItem('mc_lang', lang);

  function setText(id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  }
  function setHTML(id, val) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = val;
  }

  setText('t-page-title', t.pageTitle);
  setText('nav-login', t.login);
  setHTML('t-logged-in', t.loggedIn);
  setHTML('t-title', t.title);
  setText('t-sub', t.sub);
  setText('t-cat-label', t.catLabel);
  setText('t-c1-title', t.c1title);
  setText('t-c1-desc', t.c1desc);
  setText('t-c2-title', t.c2title);
  setText('t-c2-desc', t.c2desc);
  setText('t-c3-title', t.c3title);
  setText('t-c3-desc', t.c3desc);
  setText('t-c4-title', t.c4title);
  setText('t-c4-desc', t.c4desc);
  setText('t-c5-title', t.c5title);
  setText('t-c5-desc', t.c5desc);
  setText('t-member', t.member);
  // t-coming は複数あるので全部更新
  document.querySelectorAll('.tag-coming').forEach(el => el.textContent = t.coming);
  setText('t-banner-title', t.bannerTitle);
  setText('t-banner-btn', t.bannerBtn);
  setText('t-banner-title-top', t.bannerTitle);
  setText('t-banner-btn-top', t.bannerBtn);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === (lang === 'zh' ? '中' : lang.toUpperCase())));
}

async function init() {
  const session = await getSession();
  let isLoggedIn = false;
  // roleがindividualのときだけログイン済み扱い（法人トークンは無視）
  if (session && session.access_token && session.role === 'individual') {
    const user = await verifyToken(session.access_token);
    if (user) isLoggedIn = true;
  }
  // 常にcat-resultを有効にして/に飛ばす（/側で自動ログイン）
  document.getElementById('cat-result').classList.remove('disabled');
  if (isLoggedIn) {
    document.getElementById('logged-in-banner').classList.remove('hidden');
  } else {
    document.getElementById('nav-login').classList.remove('hidden');
    document.getElementById('register-banner').classList.remove('hidden');
    document.getElementById('register-banner-top').classList.remove('hidden');
    // 未ログインでも押せる（/に飛んでログイン画面へ）
  }
  const savedLang = localStorage.getItem('mc_lang') || 'ja';
  setLang(savedLang);
}

init();
</script>
