<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaCheck — Metabolic Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   RESET & TOKENS
═══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --forest:  #1A3C34;
  --emerald: #2D6A4F;
  --sage:    #52B788;
  --mint:    #95D5B2;
  --foam:    #D8F3DC;
  --paper:   #F7FAF8;
  --white:   #FFFFFF;
  --ink:     #0F1F1A;
  --ink2:    #2C4A40;
  --ink3:    #5A7A6E;
  --ink4:    #8FAAA0;
  --border:  #D4E6DD;
  --amber:   #D4811F;
  --amber-l: #FEF3E2;
  --ruby:    #B03A2E;
  --ruby-l:  #FDECEA;
  --gold:    #C69C2A;
  --gold-l:  #FDF6DC;
  --rank-a:  #2D6A4F; --rank-a-bg: #D8F3DC;
  --rank-b:  #3A7D44; --rank-b-bg: #E8F5E9;
  --rank-c:  #B8860B; --rank-c-bg: #FFF9C4;
  --rank-d:  #D4600A; --rank-d-bg: #FFE5CC;
  --rank-e:  #B03A2E; --rank-e-bg: #FDECEA;
  --r: 12px;
  --shadow: 0 2px 12px rgba(26,60,52,.08);
  --shadow-lg: 0 8px 32px rgba(26,60,52,.14);
}
html,body{height:100%;overflow:visible;font-family:'DM Sans',sans-serif;background:var(--forest);color:var(--ink)}

/* ═══════════════════════════════════════════════
   LOGIN SCREEN
═══════════════════════════════════════════════ */
#login-screen{
  position:fixed;inset:0;z-index:1000;
  background:linear-gradient(135deg,var(--forest) 0%,#0d2820 60%,#162d26 100%);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .6s ease,visibility .6s;
}
#login-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.login-box{
  width:420px;padding:52px 48px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;backdrop-filter:blur(20px);
  box-shadow:0 32px 80px rgba(0,0,0,.4);
}
.login-logo{
  font-family:'DM Serif Display',serif;
  font-size:36px;color:#fff;letter-spacing:-.5px;
  margin-bottom:4px;
}
.login-logo span{color:var(--sage)}
.login-sub{color:var(--mint);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:40px}
.login-role{display:flex;gap:8px;margin-bottom:28px}
.role-btn{
  flex:1;padding:10px;border:1px solid rgba(255,255,255,.15);
  background:transparent;color:rgba(255,255,255,.5);
  border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;
  font-size:13px;transition:all .2s;
}
.role-btn.active{
  background:var(--sage);border-color:var(--sage);
  color:var(--forest);font-weight:600;
}
.login-field{margin-bottom:16px}
.login-field label{display:block;color:rgba(255,255,255,.5);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.login-field input,.login-field select{
  width:100%;padding:12px 16px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;transition:border-color .2s;
}
.login-field input:focus,.login-field select:focus{border-color:var(--sage)}
.login-field select option{background:#1a3c34;color:#fff}
.login-btn{
  width:100%;padding:14px;margin-top:8px;
  background:var(--sage);border:none;border-radius:8px;
  color:var(--forest);font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:600;cursor:pointer;
  transition:all .2s;letter-spacing:.3px;
}
.login-btn:hover{background:var(--mint);transform:translateY(-1px);box-shadow:0 4px 20px rgba(82,183,136,.4)}
.login-hint{color:rgba(255,255,255,.25);font-size:11px;text-align:center;margin-top:20px}

/* ═══════════════════════════════════════════════
   MAIN LAYOUT — SPLIT
═══════════════════════════════════════════════ */
#app{display:flex;height:100vh;opacity:0;transition:opacity .5s}
#app.visible{opacity:1}
#app.clinic-only #panel-patient{display:none}
#app.clinic-only #panel-clinic{width:100%}
#app.patient-only #panel-clinic{display:none}
#app.patient-only #panel-patient{width:100%}

/* LEFT — PATIENT */
#panel-patient{
  width:42%;min-width:380px;
  background:var(--paper);
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  position:relative;
}

/* RIGHT — CLINIC */
#panel-clinic{
  flex:1;background:var(--white);
  display:flex;flex-direction:column;
  position:relative;
}

/* ═══════════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════════ */
.topbar{
  height:56px;display:flex;align-items:center;padding:0 20px;
  border-bottom:1px solid var(--border);flex-shrink:0;
  gap:12px;
}
.panel-patient .topbar{background:var(--forest)}
.panel-clinic .topbar{background:var(--white)}

.topbar-logo{
  font-family:'DM Serif Display',serif;font-size:18px;
  color:#fff;letter-spacing:-.3px;
}
.topbar-logo span{color:var(--sage)}
.topbar-label{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.4);margin-left:4px;
}
.topbar-sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px}

.clinic-topbar-logo{
  font-family:'DM Serif Display',serif;font-size:18px;
  color:var(--forest);letter-spacing:-.3px;
}
.clinic-topbar-logo span{color:var(--emerald)}
.clinic-label{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--ink4);margin-left:4px;
}
.topbar-spacer{flex:1}
.topbar-user{
  display:flex;align-items:center;gap:8px;
  color:rgba(255,255,255,.7);font-size:12px;
}
.clinic-topbar-user{
  display:flex;align-items:center;gap:8px;
  color:var(--ink3);font-size:12px;
}
.avatar{
  width:28px;height:28px;border-radius:50%;
  background:var(--sage);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--forest);flex-shrink:0;
}
.avatar.clinic-av{background:var(--foam);color:var(--emerald)}
.logout-btn{
  padding:5px 12px;border:1px solid rgba(255,255,255,.2);
  background:transparent;border-radius:6px;color:rgba(255,255,255,.6);
  font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .2s;
}
.logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.logout-btn-clinic{
  padding:5px 12px;border:1px solid var(--border);
  background:transparent;border-radius:6px;color:var(--ink4);
  font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;
}
.logout-btn-clinic:hover{border-color:var(--emerald);color:var(--emerald)}

/* ═══════════════════════════════════════════════
   PATIENT PANEL CONTENT
═══════════════════════════════════════════════ */
.patient-scroll{flex:1;overflow-y:auto;padding:20px}
.patient-scroll::-webkit-scrollbar{width:4px}
.patient-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.pt-header{
  background:var(--forest);border-radius:var(--r);
  padding:20px 24px;margin-bottom:16px;color:#fff;
}
.pt-id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mint);letter-spacing:1px;margin-bottom:4px}
.pt-name{font-size:20px;font-weight:500;margin-bottom:8px}
.pt-meta{display:flex;gap:16px;font-size:12px;color:rgba(255,255,255,.5)}
.pt-meta span{display:flex;align-items:center;gap:4px}

.section-title{
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--ink4);margin-bottom:12px;padding-left:4px;
}

/* Score grid */
.score-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;
}
.score-card{
  background:var(--white);border:1px solid var(--border);border-radius:10px;
  padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:visible;
}
.score-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--sage)}
.score-card.active{border-color:var(--emerald);box-shadow:0 0 0 2px var(--foam)}
.score-card-rank{
  position:absolute;top:10px;right:10px;
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;
}
.score-card-name{font-size:11px;color:var(--ink3);line-height:1.4;margin-bottom:6px;padding-right:36px}
.score-bar-wrap{height:4px;background:var(--border);border-radius:2px;margin-top:8px}
.score-bar{height:4px;border-radius:2px;transition:width .6s ease}

/* Patient detail panel */
.pt-detail{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:16px;
}
.pt-detail-title{
  font-size:13px;font-weight:600;color:var(--forest);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.pt-detail-rank{
  width:24px;height:24px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
}
.pt-detail-text{
  font-size:13px;color:var(--ink2);line-height:1.8;
}
.pt-cta{
  background:var(--foam);border:1px solid var(--sage);
  border-radius:10px;padding:16px 20px;
  display:flex;align-items:center;gap:12px;
}
.pt-cta-icon{font-size:24px}
.pt-cta-text{font-size:12px;color:var(--ink2);line-height:1.6}
.pt-cta-text strong{color:var(--emerald);display:block;font-size:13px;margin-bottom:2px}

/* ═══════════════════════════════════════════════
   CLINIC PANEL
═══════════════════════════════════════════════ */
.clinic-content{flex:1;display:flex;overflow:hidden}

/* Sidebar */
.clinic-sidebar{
  width:260px;border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
  background:var(--paper);
}
.sidebar-search{padding:12px 16px;border-bottom:1px solid var(--border)}
.sidebar-search input{
  width:100%;padding:8px 12px;
  border:1px solid var(--border);border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:13px;
  background:var(--white);outline:none;color:var(--ink);
}
.sidebar-search input:focus{border-color:var(--sage)}
.sidebar-list{flex:1;overflow-y:auto}
.sidebar-list::-webkit-scrollbar{width:3px}
.sidebar-list::-webkit-scrollbar-thumb{background:var(--border)}

.patient-item{
  padding:12px 16px;border-bottom:1px solid rgba(212,230,221,.5);
  cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:10px;
}
.patient-item:hover{background:var(--foam)}
.patient-item.active{background:var(--foam);border-left:3px solid var(--emerald)}
.patient-item.active .pi-id{color:var(--emerald)}
.pi-dot{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:var(--foam);display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--emerald);font-weight:600;
}
.pi-info{flex:1;min-width:0}
.pi-id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink3);margin-bottom:1px}
.pi-stat{color:var(--ink3)}
.pi-stat.warning{color:#B03A2E;font-weight:600}
.pi-meta{font-size:11px;color:var(--ink4)}
.pi-stats{display:flex;gap:2px;margin-top:4px}
.pi-rank-dot{
  width:14px;height:14px;border-radius:3px;
  font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;
}

/* Clinic main */
.clinic-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.clinic-main-scroll{flex:1;overflow-y:auto;padding:24px}
.clinic-main-scroll::-webkit-scrollbar{width:4px}
.clinic-main-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Clinic patient header */
.clinic-pt-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  background:var(--paper);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 24px;margin-bottom:20px;
}
.cph-left{}
.cph-id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink4);margin-bottom:4px}
.cph-name{font-size:20px;font-weight:600;color:var(--forest);margin-bottom:6px}
.cph-meta{display:flex;gap:16px}
.cph-badge{
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;
  background:var(--foam);color:var(--emerald);
}
.cph-right{display:flex;gap:8px}
.action-btn{
  padding:8px 16px;border-radius:8px;font-size:12px;font-weight:500;
  cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;border:none;
}
.action-btn.primary{background:var(--emerald);color:#fff}
.action-btn.primary:hover{background:var(--forest)}
.action-btn.secondary{background:var(--foam);color:var(--emerald);border:1px solid var(--sage)}
.action-btn.secondary:hover{background:var(--mint);color:var(--forest)}

/* Score overview */
.score-overview{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;
}
.sov-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:10px;padding:14px 16px;
  display:flex;flex-direction:column;gap:4px;
}
.sov-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4)}
.sov-val{font-size:28px;font-weight:600;color:var(--forest);font-family:'DM Serif Display',serif}
.sov-sub{font-size:11px;color:var(--ink4)}

/* Category detail */
.cat-tabs{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;
}
.cat-tab{
  padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;
  border:1px solid var(--border);background:var(--white);color:var(--ink3);
  transition:all .15s;font-family:'DM Sans',sans-serif;
}
.cat-tab.active{background:var(--forest);color:#fff;border-color:var(--forest)}
.cat-tab:hover:not(.active){border-color:var(--sage);color:var(--emerald)}

.cat-detail-panel{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;
}
.cdp-box{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:18px;
}
.cdp-box.full{grid-column:1/-1}
.cdp-title{
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink4);margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.cdp-title-icon{
  width:20px;height:20px;border-radius:4px;
  background:var(--foam);display:flex;align-items:center;justify-content:center;
  font-size:10px;
}
.cdp-body{font-size:13px;color:var(--ink2);line-height:1.8}
.cdp-body ul{padding-left:16px}
.cdp-body li{margin-bottom:4px}

/* Metabolites */
.metabolite-list{display:flex;flex-wrap:wrap;gap:6px}
.metabolite-tag{
  padding:3px 10px;border-radius:20px;font-size:11px;
  font-family:'JetBrains Mono',monospace;
}
.metabolite-tag.down{background:#FDECEA;color:#B03A2E}
.metabolite-tag.up{background:#E8F5E9;color:#2E7D32}
.metabolite-tag.neutral{background:var(--border);color:var(--ink3)}

/* Full score table */
.score-table{width:100%;border-collapse:collapse}
.score-table th{
  text-align:left;padding:10px 14px;
  background:var(--paper);font-size:11px;
  letter-spacing:1px;text-transform:uppercase;color:var(--ink4);
  border-bottom:1px solid var(--border);
}
.score-table td{
  padding:10px 14px;border-bottom:1px solid rgba(212,230,221,.4);
  font-size:13px;color:var(--ink2);
}
.score-table tr{cursor:pointer;transition:background .15s}
.score-table tr:hover td{background:var(--foam)}
.score-table tr.active td{background:var(--foam)}
.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:6px;
  font-size:13px;font-weight:700;
}

/* Rank colors */
.rank-A{background:var(--rank-a-bg);color:var(--rank-a)}
.rank-B{background:var(--rank-b-bg);color:var(--rank-b)}
.rank-C{background:var(--rank-c-bg);color:var(--rank-c)}
.rank-D{background:var(--rank-d-bg);color:var(--rank-d)}
.rank-E{background:var(--rank-e-bg);color:var(--rank-e)}

/* Wavg bar */
.wavg-bar-wrap{display:flex;align-items:center;gap:8px}
.wavg-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px}
.wavg-bar-fill{height:6px;border-radius:3px;transition:width .5s ease}
.wavg-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink4);width:40px}

/* Empty state */
.empty-state{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--ink4);gap:12px;padding:40px;
}
.empty-icon{font-size:48px;opacity:.4}
.empty-title{font-size:16px;font-weight:500;color:var(--ink3)}
.empty-sub{font-size:13px;text-align:center;line-height:1.6}

/* Placeholder for non-clinic login */
.clinic-placeholder{
  flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;background:var(--paper);
}
.cp-lock{font-size:64px;opacity:.15}
.cp-text{color:var(--ink4);font-size:14px;text-align:center}

/* Notice banner */
.notice{
  margin:0 20px 16px;
  padding:10px 16px;border-radius:8px;font-size:12px;
  background:var(--amber-l);color:var(--amber);border:1px solid #f0c580;
}

/* Tab switcher for clinic detail */
.detail-tabs{
  display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;
}
.detail-tab{
  padding:10px 16px;font-size:13px;cursor:pointer;
  color:var(--ink4);border-bottom:2px solid transparent;
  transition:all .15s;font-family:'DM Sans',sans-serif;
}
.detail-tab.active{color:var(--emerald);border-bottom-color:var(--emerald)}
.detail-tab:hover:not(.active){color:var(--ink2)}

/* ═══ Animations ═══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .3s ease both}

/* ═══════════════════════════════════════════════
   RADAR CHART
═══════════════════════════════════════════════ */
.chart-container{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:20px;
  position:relative;height:340px;
}
.chart-title{
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--ink4);margin-bottom:16px;
}
.chart-canvas-wrap{
  position:relative;height:280px;display:flex;align-items:center;justify-content:center;
}

/* ═══════════════════════════════════════════════
   MEMO / NOTES
═══════════════════════════════════════════════ */
.memo-box{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;margin-bottom:16px;
}
.memo-title{
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink4);margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.memo-textarea{
  width:100%;min-height:80px;padding:10px;
  border:1px solid var(--border);border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:13px;
  color:var(--ink2);resize:vertical;outline:none;
}
.memo-textarea:focus{border-color:var(--sage)}
.memo-saved{
  font-size:11px;color:var(--sage);margin-top:4px;
  opacity:0;transition:opacity .3s;
}
.memo-saved.show{opacity:1}

/* ═══════════════════════════════════════════════
   MOBILE RESPONSIVE
═══════════════════════════════════════════════ */
@media (max-width: 1024px) {
  #app{flex-direction:column}
  #panel-patient{width:100%;min-width:auto;border-right:none;border-bottom:1px solid var(--border)}
  #panel-clinic{border-top:1px solid var(--border)}
  .clinic-content{flex-direction:column}
  .clinic-sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:200px}
  .score-grid{grid-template-columns:1fr}
  .score-overview{grid-template-columns:repeat(2,1fr)}
  .cat-detail-panel{grid-template-columns:1fr}
  .login-box{width:90%;max-width:420px;padding:32px 24px}
}

@media (max-width: 640px) {
  .topbar{padding:0 12px;height:48px}

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
.timeseries-selector{
  background:var(--foam);border:1px solid var(--sage);
  border-radius:10px;padding:12px 16px;margin-bottom:16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.ts-label{
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--emerald);font-weight:600;
}
.ts-date-btn{
  padding:6px 14px;border-radius:20px;font-size:12px;
  border:1px solid var(--sage);background:var(--white);
  color:var(--emerald);cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .2s;font-weight:500;
}
.ts-date-btn:hover{background:var(--sage);color:var(--forest);border-color:var(--emerald)}
.ts-date-btn.active{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.ts-date-btn.compare{background:var(--amber-l);color:var(--amber);border-color:#f0c580}
.ts-date-btn.compare.active{background:var(--amber);color:#fff;border-color:var(--amber)}

.comparison-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;
}
.comparison-card{
  background:var(--white);border:2px solid var(--border);
  border-radius:var(--r);padding:16px;
}
.comparison-card.primary{border-color:var(--emerald)}
.comparison-card.secondary{border-color:var(--amber)}
.comp-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);
}
.comp-date{
  font-size:13px;font-weight:600;color:var(--forest);
  display:flex;align-items:center;gap:6px;
}
.comp-badge{
  padding:2px 8px;border-radius:12px;font-size:10px;
  font-weight:600;letter-spacing:0.5px;
}
.comp-badge.primary{background:var(--foam);color:var(--emerald)}
.comp-badge.secondary{background:var(--amber-l);color:var(--amber)}

.comp-score-mini{
  display:flex;flex-direction:column;gap:4px;
}
.comp-score-row{
  display:flex;align-items:center;gap:8px;font-size:11px;
}
.comp-score-label{color:var(--ink3);flex:1;min-width:0;white-space:nowrap;overflow:visible;text-overflow:ellipsis}
.comp-score-rank{
  width:20px;height:20px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;
}
.comp-score-val{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--ink4);width:45px;text-align:right;flex-shrink:0;
}
.comp-score-change{
  font-size:10px;font-weight:600;width:35px;text-align:right;flex-shrink:0;
}
.comp-score-change.up{color:#B03A2E}
.comp-score-change.down{color:#2E7D32}
.comp-score-change.neutral{color:var(--ink4)}

.trend-chart-container{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;margin-bottom:20px;height:300px;
}

<script>

// ═══════════════════════════════════════════════════════════════
//  軽量Chart.js代替実装（CSP対応）
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
//  軽量Chart.js代替実装（CSP対応 + ツールチップ）
// ═══════════════════════════════════════════════════════════════
class SimpleChart {
  constructor(canvas, config) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.config = config;
    this.destroyed = false;
    this.tooltip = null;
    this.hoveredPoint = null;
    
    // マウスイベント追加
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('mouseleave', () => this.handleMouseLeave());
    
    this.draw();
  }
  
  destroy() {
    this.destroyed = true;
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    if(this.tooltip) {
      this.tooltip.remove();
      this.tooltip = null;
    }
  }
  
  handleMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    const w = rect.width;
    const h = rect.height;
    const padding = 60;
    const plotW = w - padding * 2;
    const plotH = h - padding * 2;
    
    const opts = this.config.options;
    const datasets = this.config.data.datasets;
    
    const yMin = opts.scales.y.min || -12;
    const yMax = opts.scales.y.max || 12;
    const xMin = opts.scales.x.min || -0.5;
    const xMax = opts.scales.x.max || 0.5;
    
    const toX = (x) => padding + ((x - xMin) / (xMax - xMin)) * plotW;
    const toY = (y) => padding + plotH - ((y - yMin) / (yMax - yMin)) * plotH;
    
    // 点との距離を計算
    let closestPoint = null;
    let closestDist = Infinity;
    let closestDataset = null;
    
    datasets.forEach(ds => {
      if(ds.type === 'scatter') {
        ds.data.forEach((pt, i) => {
          const x = toX(pt.x);
          const y = toY(pt.y);
          const r = Array.isArray(ds.pointRadius) ? ds.pointRadius[i] : ds.pointRadius || 3;
          const dist = Math.sqrt((mouseX - x) ** 2 + (mouseY - y) ** 2);
          
          if(dist <= r + 5 && dist < closestDist) {
            closestDist = dist;
            closestPoint = {pt, x, y, index: i};
            closestDataset = ds;
          }
        });
      }
    });
    
    if(closestPoint) {
      this.showTooltip(closestPoint, closestDataset, e.clientX, e.clientY);
      this.canvas.style.cursor = 'pointer';
    } else {
      this.hideTooltip();
      this.canvas.style.cursor = 'default';
    }
  }
  
  handleMouseLeave() {
    this.hideTooltip();
    this.canvas.style.cursor = 'default';
  }
  
  showTooltip(point, dataset, clientX, clientY) {
    if(!this.tooltip) {
      this.tooltip = document.createElement('div');
      this.tooltip.style.position = 'fixed';
      this.tooltip.style.backgroundColor = 'rgba(26, 60, 52, 0.95)';
      this.tooltip.style.color = 'white';
      this.tooltip.style.padding = '12px';
      this.tooltip.style.borderRadius = '6px';
      this.tooltip.style.fontSize = '12px';
      this.tooltip.style.fontFamily = '"DM Sans", sans-serif';
      this.tooltip.style.pointerEvents = 'none';
      this.tooltip.style.zIndex = '10000';
      this.tooltip.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
      this.tooltip.style.lineHeight = '1.5';
      document.body.appendChild(this.tooltip);
    }
    
    const callbacks = this.config.options.plugins.tooltip.callbacks;
    const title = callbacks.title ? callbacks.title([{raw: point.pt}]) : '';
    const labels = callbacks.label ? callbacks.label({raw: point.pt}) : [];
    
    this.tooltip.innerHTML = `
      <div style="font-weight:600;font-size:13px;margin-bottom:6px">${title}</div>
      ${labels.map(l => `<div>${l}</div>`).join('')}
    `;
    
    this.tooltip.style.left = (clientX + 15) + 'px';
    this.tooltip.style.top = (clientY - 10) + 'px';
    this.tooltip.style.display = 'block';
  }
  
  hideTooltip() {
    if(this.tooltip) {
      this.tooltip.style.display = 'none';
    }
  }
  
  draw() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width;
    this.canvas.height = rect.height;
    
    const w = rect.width;
    const h = rect.height;
    const padding = 60;
    const plotW = w - padding * 2;
    const plotH = h - padding * 2;
    
    const ctx = this.ctx;
    const opts = this.config.options;
    const datasets = this.config.data.datasets;
    
    // 背景
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    
    // Y軸範囲
    const yMin = opts.scales.y.min || -12;
    const yMax = opts.scales.y.max || 12;
    const xMin = opts.scales.x.min || -0.5;
    const xMax = opts.scales.x.max || 0.5;
    
    // 座標変換
    const toX = (x) => padding + ((x - xMin) / (xMax - xMin)) * plotW;
    const toY = (y) => padding + plotH - ((y - yMin) / (yMax - yMin)) * plotH;
    
    // グリッド線
    ctx.strokeStyle = 'rgba(212, 230, 221, 0.6)';
    ctx.lineWidth = 1;
    
    for(let i = Math.ceil(yMin); i <= Math.floor(yMax); i++) {
      const y = toY(i);
      if(i === 0) {
        ctx.strokeStyle = '#2C4A40';
        ctx.lineWidth = 3;
      } else {
        ctx.strokeStyle = 'rgba(212, 230, 221, 0.6)';
        ctx.lineWidth = 1;
      }
      ctx.beginPath();
      ctx.moveTo(padding, y);
      ctx.lineTo(w - padding, y);
      ctx.stroke();
    }
    
    // Y軸ラベル
    ctx.fillStyle = '#5A7A6E';
    ctx.font = '11px "DM Sans", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    
    for(let i = Math.ceil(yMin); i <= Math.floor(yMax); i += 2) {
      const y = toY(i);
      ctx.fillText(i, padding - 10, y);
    }
    
    // X軸ラベル
    const xTickCallback = opts.scales.x.ticks.callback;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = '10px "DM Sans", sans-serif';
    ctx.fillStyle = '#8FAAA0';
    
    for(let i = 0; i <= Math.floor((xMax - xMin) / 2); i++) {
      const x = toX(i * 2);
      const label = xTickCallback ? xTickCallback.call({chart: this}, i * 2) : '';
      if(label) ctx.fillText(label, x, h - padding + 10);
    }
    
    // Y軸タイトル
    ctx.save();
    ctx.translate(20, h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 13px "DM Sans", sans-serif';
    ctx.fillStyle = '#2C4A40';
    ctx.textAlign = 'center';
    ctx.fillText(opts.scales.y.title.text || '', 0, 0);
    ctx.restore();
    
    // X軸タイトル
    if(opts.scales.x.title.display) {
      ctx.font = '11px "DM Sans", sans-serif';
      ctx.fillStyle = '#5A7A6E';
      ctx.textAlign = 'center';
      ctx.fillText(opts.scales.x.title.text || '', w / 2, h - 20);
    }
    
    // データ描画（線 → 点の順）
    datasets.forEach(ds => {
      if(ds.type === 'line') {
        // 線
        ctx.strokeStyle = ds.borderColor;
        ctx.lineWidth = ds.borderWidth || 1;
        ctx.beginPath();
        ds.data.forEach((pt, i) => {
          const x = toX(pt.x);
          const y = toY(pt.y);
          if(i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }
    });
    
    datasets.forEach(ds => {
      if(ds.type === 'scatter') {
        
        // 散布点
        ds.data.forEach((pt, i) => {
          const x = toX(pt.x);
          const y = toY(pt.y);
          const r = Array.isArray(ds.pointRadius) ? ds.pointRadius[i] : ds.pointRadius || 3;
          
          const color = Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : ds.backgroundColor;
          
          ctx.fillStyle = color;
          ctx.strokeStyle = Array.isArray(ds.borderColor) ? ds.borderColor[i] : ds.borderColor;
          ctx.lineWidth = ds.borderWidth || 1;
          
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
      }
    });
  }
}

// Chart.jsインターフェース互換
window.Chart = SimpleChart;


document.addEventListener('click', () => {

});

</script>

function changeLanguage(lang) {
  userLang = lang;
  localStorage.setItem('metacheck_lang', lang);
  applyI18n();
  
  // ボタンの状態更新
  document.querySelectorAll('.login-lang-btn, .lang-option').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);

  const langLabels = { 'ja': 'JA', 'en': 'EN', 'vi': 'VI' };

    if (textEl) textEl.textContent = langLabels[lang];
  });
}

function rankColor(r){
  return{A:'rank-A',B:'rank-B',C:'rank-C',D:'rank-D',E:'rank-E'}[r]||'rank-A';
}
function rankBg(r){
  return{
    A:['#D8F3DC','#2D6A4F'],B:['#E8F5E9','#3A7D44'],
    C:['#FFF9C4','#B8860B'],D:['#FFE5CC','#D4600A'],
    E:['#FDECEA','#B03A2E']
  }[r]||['#D8F3DC','#2D6A4F'];
}
function rankBarColor(r){
  return{A:'#2D6A4F',B:'#52B788',C:'#D4A017',D:'#D4600A',E:'#B03A2E'}[r]||'#2D6A4F';
}
function parseMetabolites(str){
  if(!str) return [];
  return str.split('、').map(s=>{
    const dir = s.endsWith('↓')?'down':s.endsWith('↑')?'up':'neutral';
    const name = s.replace(/[↑↓→]/g,'').trim();
    return{name,dir};
  }).filter(m=>m.name);
}
function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatText(s){
  return escHtml(s).replace(/\n/g,'<br>').replace(/・/g,'<br>・');
}

function setRole(role){
  currentRole = role;
  document.getElementById('role-patient').classList.toggle('active', role==='patient');
  document.getElementById('role-clinic').classList.toggle('active', role==='clinic');
  document.getElementById('field-patient-id').style.display = role==='patient'?'block':'none';
  document.getElementById('field-clinic-id').style.display = role==='clinic'?'block':'none';
}

function doLogin(){
  const app = document.getElementById('app');
  if(currentRole==='patient'){
    const sel = document.getElementById('sel-patient-id');
    currentPatientId = sel.value;
    currentClinic = null;
    app.className = 'visible patient-only';
    showApp();
    renderPatientPanel(currentPatientId);
    renderClinicLocked();
  } else {
    const sel = document.getElementById('sel-clinic-id');
    currentClinic = sel.value;
    currentPatientId = null;
    app.className = 'visible clinic-only';
    showApp();
    renderPatientPanelEmpty();
    renderClinicPanel(currentClinic);

function switchPatientDetailTab(tab, el, pid, catName){
  console.log('=== switchPatientDetailTab called ===');
  console.log('tab:', tab);
  console.log('pid:', pid);
  console.log('catName:', catName);
  
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  
  const patient = typeof pid === 'string' ? PATIENT_DATA[pid] : currentPatientData;
  console.log('patient:', patient);
  const cat = patient.categories.find(c => c.category === catName);
  if(!cat) return;
  
  const body = document.getElementById('patient-detail-tab-body');
  if(!body) return;
  
  if(tab === 'metabolites'){
    // 個別代謝物タブ
    const measurements = patient.measurements || [{date: patient.date, categories: patient.categories}];
    const allMeasurementData = measurements.map((m, mIdx) => {
      const metData = METABOLITE_DATA?.[pid]?.[catName] || [];
      console.log('測定', mIdx, ':', metData.length, 'metabolites');
      return { date: m.date, index: mIdx, metData: metData };
    });
    console.log('allMeasurementData:', allMeasurementData);
    
    const latestMetData = allMeasurementData[0]?.metData || [];
    
    if(latestMetData.length === 0){
      body.innerHTML = '<p style="text-align:center;color:var(--ink4);padding:40px">このカテゴリの詳細データがありません</p>';
      return;
    }
    
    const sortedMets = [...latestMetData].sort((a,b) => {
      const scoreA = (a.weight || 0) * Math.abs(a.log2fc || 0);
      const scoreB = (b.weight || 0) * Math.abs(b.log2fc || 0);
      return scoreB - scoreA;
    });
    
    body.innerHTML = `
      <div style="height:350px;position:relative;margin-bottom:16px">
        <canvas id="metabolite-scatter-chart"></canvas>
      </div>
      <div style="max-height:400px;overflow-y:auto">
        ${renderMetaboliteTableMulti(sortedMets, measurements)}
      </div>
    `;
    
    setTimeout(() => drawMetaboliteScatterMulti(allMeasurementData, catName), 50);
    
  } else if(tab === 'patient'){
    // 患者向けコメントタブ
    body.innerHTML = `
      <div style="overflow-x:auto">
        <table class="score-table" style="table-layout:fixed;width:100%">
          <thead>
            <tr>
              <th style="width:35%">変動について</th>
              <th style="width:65%">生活で気をつけること</th>
            </tr>
          </thead>
          <tbody>
            ${(cat.metabolite_insights || []).map(insight => `
              <tr style="vertical-align:top">
                <td style="padding:12px;line-height:1.6;background:rgba(33,150,243,0.05)">
                  ${insight.movement}
                </td>
                <td style="padding:12px;line-height:1.6;background:rgba(46,125,50,0.05)">
                  ${insight.patient_comment}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }
}

function renderClinicScoreTable(d){
  const tbody = document.getElementById('clinic-score-tbody');
  if(!tbody) return;
  tbody.innerHTML = d.categories.map(c=>{
    const measurements = d.measurements || [{categories: d.categories}];
    const isMulti = measurements.length > 1;
    
    // 最新と最古の測定でスコア変化を計算
    let changeHtml = '<td>—</td>';
    if(isMulti){
      const oldCat = measurements[0].categories.find(ct => ct.category === c.category);
      const newCat = measurements[measurements.length - 1].categories.find(ct => ct.category === c.category);
      if(oldCat && newCat){
        const change = newCat.wavg - oldCat.wavg;
        const changePercent = ((change / oldCat.wavg) * 100).toFixed(1);
        const arrow = change > 0.05 ? '↑' : change < -0.05 ? '↓' : '→';
        const color = change > 0.05 ? '#B03A2E' : change < -0.05 ? '#2E7D32' : 'var(--ink4)';
        changeHtml = `<td style="color:${color};font-weight:600">${arrow} ${changePercent}%</td>`;
      }
    }
    
    const barW = Math.min(100, c.wavg * 80);
    const barC = rankBarColor(c.rank);
    const mets = parseMetabolites(c.metabolites).slice(0,3);
    const metHtml = mets.map(m=>{
    const desc = METABOLITE_DESCRIPTIONS ? (METABOLITE_DESCRIPTIONS[m.name] || '') : '';
    const arrow = m.dir==='down'?'↓':m.dir==='up'?'↑':'';
    return `<span class="metabolite-tag ${m.dir}" title="${desc}" style="cursor:${desc?'help':'default'};${desc?'border-bottom:1px dotted #666':''}">${m.name}${arrow}</span>`;
  }).join('');
    return `
    <tr onclick="selectClinicCategory('${clinicSelectedPatient}','${c.category.replace(/'/g,"\\'")}')">
      <td><strong>${CAT_ICONS[c.category]||''} ${CAT_JA[c.category]||c.category}</strong><br><span style="font-size:10px;color:var(--ink4)">${c.category}</span></td>
      <td><span class="rank-badge ${rankColor(c.rank)}">${c.rank}</span></td>
      <td>
        <div class="wavg-bar-wrap">
          <div class="wavg-bar-bg"><div class="wavg-bar-fill" style="width:${barW}%;background:${barC}"></div></div>
          <div class="wavg-num">${c.wavg.toFixed(3)}</div>
        </div>
      </td>
      <td><div class="metabolite-list">${metHtml}</div></td>
    </tr>`;
  }).join('');
}

function switchDetailTab(tab, el, pid, catName){
  document.querySelectorAll('.detail-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');

  const d = PATIENT_DATA[pid];
  const cat = d?.categories.find(c=>c.category===catName);
  if(!cat) return;

  const titles = {
    metabolites:['🧪','個別代謝物データ','metabolites'],
    clinical:['🔬','臨床解釈・介入（医師専用）','clinical'],
    patient:['💬','患者向けコメント','patient']
  };
  const [icon,title,key] = titles[tab]||titles.metabolites;
  const body = document.getElementById('clinic-detail-body');
  
    if(tab === 'metabolites'){
    // 代謝物タブ：カテゴリごとの散布図 + テーブル（複数測定対応）
    if(!body) return;
    
    const d = PATIENT_DATA[pid];
    const measurements = d.measurements || [{date: d.date, categories: d.categories}];
    
    // 各測定ごとに、このカテゴリのデータを取得
    const allMeasurementData = measurements.map((m, mIdx) => {
      const cat = m.categories.find(c => c.category === catName);
      const metData = METABOLITE_DATA?.[pid]?.[catName] || [];
      return {
        date: m.date,
        index: mIdx,
        metData: metData

    });
    
    // 最新測定のデータでテーブル表示
    const latestMetData = allMeasurementData[selectedMeasurementIndex]?.metData || [];
    
    if(latestMetData.length === 0){
      body.innerHTML = `
        <div class="cdp-title"><div class="cdp-title-icon">${icon}</div>${title}</div>

      return;
    }
    
    // デフォルトソート：Weight × abs(log2FC) の降順
    const sortedMets = [...latestMetData].sort((a,b) => {

      return scoreB - scoreA;

  } else if(tab === 'clinical'){

            </tr>
          </thead>
          <tbody>
            ${(cat.metabolite_insights || []).map((insight, idx) => `
              <tr style="vertical-align:top">
                ${idx === 0 ? `<td rowspan="${cat.metabolite_insights.length}" style="padding:12px;line-height:1.6;background:var(--sage);border-right:2px solid var(--emerald);font-weight:600;color:var(--forest);vertical-align:middle;text-align:center">

let metaboliteScatterChart = null;
function drawMetaboliteScatter(data, catName){
  const canvas = document.getElementById('metabolite-scatter-chart');
  if(!canvas) return;
  
  if(metaboliteScatterChart) metaboliteScatterChart.destroy();
  
  // 色分け：log2FC > 0 = 赤、< 0 = 青
  // サイズ：Weightに応じて変化
  const colors = data.map(d => d.y > 0 ? 'rgba(176, 58, 46, 0.7)' : 'rgba(46, 125, 50, 0.7)');
  const radii = data.map(d => 4 + (d.weight || 0) * 2.5);
  
  // 横にランダムにばらつかせて重ならないようにする
  const dataWithJitter = data.map(d => ({
    ...d,
    x: (Math.random() - 0.5) * 0.3 // -0.15 〜 0.15 の範囲でランダム
  }));
  
  metaboliteScatterChart = new Chart(canvas, {
    type: 'scatter',
    data: {
      datasets: [{
        label: CAT_JA[catName] || catName,
        data: dataWithJitter,
        backgroundColor: colors,
        borderColor: colors.map(c => c.replace('0.7', '1')),
        borderWidth: 1,
        pointRadius: 2,
        pointHoverRadius: radii.map(r => r + 2)
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          title: {
            display: true,
            text: 'log2 Fold Change（高い / 低い）',
            font: { size: 12, family: 'DM Sans', weight: '600' },
            color: '#2C4A40'
          },
          ticks: {
            font: { size: 11, family: 'DM Sans' },
            color: '#5A7A6E'
          },
          grid: { 
            color: (ctx) => ctx.tick.value === 0 ? '#2C4A40' : 'rgba(212, 230, 221, 0.6)',
            lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1
          }
        },
        x: {
          title: {
            display: true,
            text: '測定回（今後複数測定時に横に並ぶ）',
            font: { size: 11, family: 'DM Sans' },
            color: '#8FAAA0'
          },
          min: -1,
          max: 1,
          ticks: {
            display: false
          },
          grid: { 
            color: 'rgba(212, 230, 221, 0.3)',
            drawTicks: false
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(26, 60, 52, 0.95)',
          titleFont: { size: 13, family: 'DM Sans', weight: '600' },
          bodyFont: { size: 12, family: 'DM Sans' },
          padding: 12,
          callbacks: {
            title: (ctx) => ctx[0].raw.compound,
            label: (ctx) => [
              `乖離度: ${ctx.raw.y.toFixed(3)} ${ctx.raw.y > 0 ? '↑' : '↓'}`,
              `実測値: ${ctx.raw.sample.toFixed(2)}`,
              `基準値: ${ctx.raw.baseline.toFixed(2)}`,
              `Weight: ${ctx.raw.weight.toFixed(1)} （影響度${ctx.raw.weight > 2 ? '大' : ctx.raw.weight > 1 ? '中' : '小'}）`
            ]
          }
        }
      }
    }
  });
}

function selectMeasurement(pid, index){
  selectedMeasurementIndex = index;
  compareMeasurementIndex = null;
  selectClinicPatient(pid);
}

function toggleCompare(pid, index){
  if(index === selectedMeasurementIndex){
    alert('同じ測定を比較することはできません');
    return;
  }
  compareMeasurementIndex = (compareMeasurementIndex === index) ? null : index;
  selectClinicPatient(pid);
}

function renderComparison(pid, idx1, idx2){
  const d = PATIENT_DATA[pid];
  const m1 = d.measurements[idx1];
  const m2 = d.measurements[idx2];
  
  const html = `
    <div class="comparison-grid fade-up">
      <div class="comparison-card primary">
        <div class="comp-header">
          <div class="comp-date">📅 ${m1.date}<span class="comp-badge primary">基準</span></div>
        </div>
        <div class="comp-score-mini">
          ${m1.categories.slice(0, 8).map(c => `
            <div class="comp-score-row">
              <div class="comp-score-label">${CAT_JA[c.category]||c.category}</div>
              <div class="comp-score-rank rank-badge ${rankColor(c.rank)}">${c.rank}</div>
              <div class="comp-score-val">${c.wavg.toFixed(3)}</div>
              <div class="comp-score-change">—</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="comparison-card secondary">
        <div class="comp-header">
          <div class="comp-date">📅 ${m2.date}<span class="comp-badge secondary">比較</span></div>
        </div>
        <div class="comp-score-mini">
          ${m2.categories.slice(0, 8).map((c, i) => {
            const baseline = m1.categories[i];
            const diff = c.wavg - baseline.wavg;
            const diffClass = diff > 0.05 ? 'up' : diff < -0.05 ? 'down' : 'neutral';
            const diffText = diff > 0.05 ? `+${(diff*100).toFixed(0)}%` : diff < -0.05 ? `${(diff*100).toFixed(0)}%` : '—';
            return `
            <div class="comp-score-row">
              <div class="comp-score-label">${CAT_JA[c.category]||c.category}</div>
              <div class="comp-score-rank rank-badge ${rankColor(c.rank)}">${c.rank}</div>
              <div class="comp-score-val">${c.wavg.toFixed(3)}</div>
              <div class="comp-score-change ${diffClass}">${diffText}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
  return html;
}

function drawMetaboliteScatterMulti(allMeasurementData, catName){
  const canvas = document.getElementById('metabolite-scatter-chart');
  if(!canvas) return;
  
  if(metaboliteScatterChart) metaboliteScatterChart.destroy();
  
  // 散布図データセット（各測定ごと）
  const scatterDatasets = allMeasurementData.map((measurement, mIdx) => {
    const metData = measurement.metData.filter(m => m.weight > 0);
    const xPos = mIdx * 2;
    
    const points = metData.map(m => ({
      x: xPos,
      y: m.log2fc || 0,
      compound: m.compound,
      sample: m.sample,
      baseline: m.baseline,
      weight: m.weight
    }));
    
    const colors = points.map(p => {
      if(p.y > 0) return 'rgba(220, 53, 69, 0.8)';
      if(p.y < 0) return 'rgba(13, 110, 253, 0.8)';
      return 'rgba(108, 117, 125, 0.6)';
    });
    
    const radii = points.map(p => 5 + (p.weight || 0) * 2.5);
    
    return {
      type: 'scatter',
      label: measurement.date,
      data: points,
      backgroundColor: colors,
      borderColor: colors,
      borderWidth: 1,
      pointRadius: 2,
      pointHoverRadius: radii.map(r => r + 2),
      order: 1
    };
  });
  
  // 線データセット（同じ代謝物を繋ぐ）
  const lineDatasets = [];
  if(allMeasurementData.length > 1){
    // 1回目のデータから代謝物リストを取得
    const firstMets = allMeasurementData[0].metData.filter(m => m.weight > 0);
    
    firstMets.forEach(met => {
      const linePoints = allMeasurementData.map((measurement, mIdx) => {
        const found = measurement.metData.find(m => m.compound === met.compound);
        return {
          x: mIdx * 2,
          y: found ? (found.log2fc || 0) : null
        };
      }).filter(p => p.y !== null);
      
      if(linePoints.length > 1){
        lineDatasets.push({
          type: 'line',
          data: linePoints,
          borderColor: 'rgba(138, 170, 160, 0.3)',
          borderWidth: 1,
          pointRadius: 0,
          pointHoverRadius: 0,
          fill: false,
          tension: 0,
          order: 2
        });
      }
    });
  }
  
  const allDatasets = [...lineDatasets, ...scatterDatasets];
  
  console.log('患者パネル散布図データ:');
  console.log('scatterDatasets:', scatterDatasets);
  scatterDatasets.forEach((ds, idx) => {
    console.log(`  データセット${idx}: pointRadius =`, ds.pointRadius);
  });
  
  metaboliteScatterChart = new Chart(canvas, {
    type: 'scatter',
    data: { datasets: allDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          title: {
            display: true,
            text: '基準値からの乖離度（🔴高い / 🔵低い）',
            font: { size: 13, family: 'DM Sans', weight: '600' },
            color: '#2C4A40'
          },
          min: -12,
          max: 12,
          ticks: {
            font: { size: 11, family: 'DM Sans' },
            color: '#5A7A6E'
          },
          grid: { 
            color: (ctx) => ctx.tick.value === 0 ? '#2C4A40' : 'rgba(212, 230, 221, 0.6)',
            lineWidth: (ctx) => ctx.tick.value === 0 ? 3 : 1
          }
        },
        x: {
          title: {
            display: allMeasurementData.length > 1,
            text: '測定回',
            font: { size: 11, family: 'DM Sans' },
            color: '#5A7A6E'

const miniCharts = {};
function drawMiniScatter(pid, catName, measurements, canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  
  if(miniCharts[canvasId]) {
    miniCharts[canvasId].destroy();
  }
  
  const metData = METABOLITE_DATA?.[pid]?.[catName] || [];
  if(metData.length === 0) return;
  
  const filteredMets = metData.filter(m => m.weight > 0);
  if(filteredMets.length === 0) return;
  
  // 散布図データセット
  const scatterDatasets = measurements.map((m, mIdx) => {
    const xPos = mIdx * 1.5;
    
    const points = filteredMets.map(met => ({
      x: xPos,
      y: met.log2fc || 0,
      compound: met.compound
    }));
    
    const colors = points.map(p => {
      if(p.y > 0) return 'rgba(220, 53, 69, 0.9)';
      if(p.y < 0) return 'rgba(13, 110, 253, 0.9)';
      return 'rgba(108, 117, 125, 0.6)';
    });
    
    return {
      type: 'scatter',
      data: points,
      backgroundColor: colors,
      borderColor: colors,
      borderWidth: 0,
      pointRadius: 2.5,
      pointHoverRadius: 4.5,
      order: 1
    };
  });
  
  // 線データセット
  const lineDatasets = [];
  if(measurements.length > 1){
    filteredMets.forEach(met => {
      const linePoints = measurements.map((m, mIdx) => ({
        x: mIdx * 1.5,
        y: met.log2fc || 0
      }));
      
      lineDatasets.push({
        type: 'line',
        data: linePoints,
        borderColor: 'rgba(138, 170, 160, 0.25)',
        borderWidth: 0.5,
        pointRadius: 0,
        fill: false,
        tension: 0,
        order: 2
      });
    });
  }
  
  const allDatasets = [...lineDatasets, ...scatterDatasets];
  
  console.log('患者パネル散布図データ:');
  console.log('scatterDatasets:', scatterDatasets);
  scatterDatasets.forEach((ds, idx) => {
    console.log(`  データセット${idx}: pointRadius =`, ds.pointRadius);
  });
  
  miniCharts[canvasId] = new Chart(canvas, {
    type: 'scatter',
    data: { datasets: allDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          display: true,
          min: -12,
          max: 12,
          ticks: { display: false },
          grid: { 
            color: (ctx) => ctx.tick.value === 0 ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.08)',
            lineWidth: (ctx) => ctx.tick.value === 0 ? 2.5 : 0.5
          }
        },
        x: {
          display: false,
          min: -0.3,
          max: Math.max(0.3, (measurements.length - 1) * 1.5 + 0.3)
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: true,
          backgroundColor: 'rgba(0,0,0,0.9)',
          titleFont: { size: 10, family: 'DM Sans' },
          bodyFont: { size: 9, family: 'DM Sans' },
          padding: 6,
          filter: function(item) {
            return item.dataset.type === 'scatter';
          },
          callbacks: {
            title: (ctx) => ctx[0].raw.compound,
            label: (ctx) => `乖離度: ${ctx.raw.y.toFixed(2)}`
          }
        }
      }
    }
  });
}


const miniBarCharts = {};
function drawMiniBar(pid, catName, measurements, canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  
  if(miniBarCharts[canvasId]) {
    miniBarCharts[canvasId].destroy();
  }
  
  // 各測定のWAVG値を取得
  const data = measurements.map((m, idx) => {
    const cat = m.categories.find(c => c.category === catName);
    return cat ? cat.wavg : 0;
  });
  
  // ランクに応じた色
  const colors = measurements.map((m, idx) => {
    const cat = m.categories.find(c => c.category === catName);
    if(!cat) return '#D4E6DD';
    const rank = cat.rank;
    if(rank === 'A') return '#2D6A4F';
    if(rank === 'B') return '#52B788';
    if(rank === 'C') return '#D4A017';
    if(rank === 'D') return '#D4600A';
    if(rank === 'E') return '#B03A2E';
    return '#D4E6DD';
  });
  
  miniBarCharts[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: measurements.map((m, i) => (i+1) + '回目'),
      datasets: [{
        data: data,
        backgroundColor: colors,
        borderColor: colors.map(c => c),
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          display: false,
          min: 0,
          max: 1.2
        },
        x: {
          display: true,
          ticks: {
            display: measurements.length > 1,
            font: { size: 7 },
            color: 'rgba(0,0,0,0.5)'
          },
          grid: { display: false }

      },

  });

function renderMetaboliteTable(mets){
  return `
    <table class="score-table">
      <thead><tr>
        <th>代謝物</th>
        <th>重要度</th>
        <th>実測値</th>
        <th>基準値</th>
        <th>乖離度</th>
        <th>前回比</th>
      </tr></thead>
      <tbody>
        ${mets.map(m => {
          const weightBadge = m.weight > 2 ? 'background:#2D6A4F;color:#fff' : m.weight > 1 ? 'background:#95D5B2;color:#1A3C34' : 'background:#D4E6DD;color:#5A7A6E';
          
          // 前回比の計算（複数測定がある場合）
          let changeHtml = '<td>—</td>';
          if(m.previousLog2FC !== undefined && m.previousLog2FC !== null){
            const change = m.log2fc - m.previousLog2FC;
            const arrow = change > 0.1 ? '↑' : change < -0.1 ? '↓' : '→';
            const color = change > 0.1 ? '#B03A2E' : change < -0.1 ? '#2E7D32' : 'var(--ink4)';
            changeHtml = `<td style="color:${color};font-weight:600">${arrow} ${change.toFixed(2)}</td>`;
          }
          
          return `
          <tr>
            <td><strong>${m.compound}</strong></td>
            <td><span style="padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;${weightBadge}">${m.weight.toFixed(1)}</span></td>
            <td>${m.sample.toFixed(2)}</td>
            <td>${m.baseline.toFixed(2)}</td>
            <td style="font-family:'JetBrains Mono',monospace">${m.log2fc.toFixed(3)}</td>
            ${changeHtml}
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function renderMetaboliteTableMulti(mets, measurements){
  // ヘッダー行を生成
  const headers = ['代謝物', '重要度', '基準値'];
  measurements.forEach(m => {
    headers.push(`実測値 (${m.date})`);
  });
  if(measurements.length > 1){
    headers.push('前回比');
  }
  
  const headerHtml = headers.map(h => `<th>${h}</th>`).join('');
  
  // データ行を生成
  const rowsHtml = mets.map(m => {
    const weightBadge = m.weight > 2 ? 'background:#2D6A4F;color:#fff' : m.weight > 1 ? 'background:#95D5B2;color:#1A3C34' : 'background:#D4E6DD;color:#5A7A6E';
    
    let cells = `
      <td><strong>${m.compound}</strong></td>
      <td><span style="padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;${weightBadge}">${m.weight.toFixed(1)}</span></td>
      <td>${m.baseline.toFixed(2)}</td>
      <td>${m.sample.toFixed(2)}</td>`;
    
    // 複数測定の場合、各測定値を追加
    if(measurements.length > 1){
      // 2回目以降の測定値（現在のデータには1回目しかないのでダミー）
      for(let i = 1; i < measurements.length; i++){
        cells += `<td>—</td>`;
      }
      
      // 前回比
      cells += `<td>—</td>`;
    }
    
    return `<tr>${cells}</tr>`;
  }).join('');
  
  return `
    <table class="score-table">
      <thead><tr>${headerHtml}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}


function sortMetabolites(pid, catName, sortType){
  const metData = METABOLITE_DATA?.[pid]?.[catName] || [];
  if(metData.length === 0) return;
  
  let sorted = [...metData];
  switch(sortType){
    case 'weight':
      sorted.sort((a,b) => {
        const scoreA = (a.weight || 0) * Math.abs(a.log2fc || 0);
        const scoreB = (b.weight || 0) * Math.abs(b.log2fc || 0);
        return scoreB - scoreA;
      });
      break;
    case 'abs_log2fc':
      sorted.sort((a,b) => Math.abs(b.log2fc) - Math.abs(a.log2fc));
      break;
    case 'log2fc_asc':
      sorted.sort((a,b) => a.log2fc - b.log2fc);
      break;
    case 'log2fc_desc':
      sorted.sort((a,b) => b.log2fc - a.log2fc);
      break;
  }
  
  const container = document.getElementById('metabolite-table-container');
  if(container){
    container.innerHTML = renderMetaboliteTable(sorted);
  }
}

function switchPatientTab(tab, el, pid, catName) {
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));

  const patient = PATIENT_DATA[pid];
  const cat = patient.categories.find(c => c.category === catName);
  if(!cat) return;
  
  const body = document.getElementById('patient-tab-body');
  if(!body) return;
  
  if(tab === 'metabolites') {
    // 個別代謝物タブ（クリニック版と同じ）
    const measurements = patient.measurements || [{date: patient.date, categories: patient.categories}];
    const allMeasurementData = measurements.map((m, mIdx) => {
      const catData = m.categories.find(c => c.category === catName);
      const metData = METABOLITE_DATA?.[pid]?.[catName] || [];
      return { date: m.date, index: mIdx, metData: metData };
    });
    
    const latestMetData = allMeasurementData[0]?.metData || [];
    
    if(latestMetData.length === 0) {
      body.innerHTML = '<p style="text-align:center;color:var(--ink4);padding:40px">このカテゴリの詳細データがありません</p>';
      return;
    }
    
    const sortedMets = [...latestMetData].sort((a,b) => {
      const scoreA = (a.weight || 0) * Math.abs(a.log2fc || 0);
      const scoreB = (b.weight || 0) * Math.abs(b.log2fc || 0);
      return scoreB - scoreA;
    });
    
    body.innerHTML = `
      <div style="height:400px;position:relative;margin-bottom:16px">
        <canvas id="patient-metabolite-chart"></canvas>
      </div>
      <div style="max-height:400px;overflow-y:auto">
        ${renderMetaboliteTableMulti(sortedMets, measurements)}
      </div>
    `;
    
    setTimeout(() => drawMetaboliteScatterMulti(allMeasurementData, catName, 'patient-metabolite-chart'), 50);
    
  } else if(tab === 'patient') {
    // 患者向けコメントタブ
    body.innerHTML = `

      if(p.y > 0) return 'rgba(220, 53, 69, 0.8)';
      if(p.y < 0) return 'rgba(13, 110, 253, 0.8)';
      return 'rgba(108, 117, 125, 0.6)';
    });
    
    const radii = points.map(p => 5 + (p.weight || 0) * 2.5);
    
    return {
      type: 'scatter',
      label: measurement.date,
      data: points,
      backgroundColor: colors,
      borderColor: colors,
      borderWidth: 1,
      pointRadius: radii,
      pointHoverRadius: radii.map(r => r + 2),
      order: 1
    };
  });
  
  // 線データセット（同じ代謝物を繋ぐ）
  const lineDatasets = [];
  if(allMeasurementData.length > 1){
    const firstMets = allMeasurementData[0].metData.filter(m => m.weight > 0);
    
    firstMets.forEach(met => {
      const linePoints = allMeasurementData.map((measurement, mIdx) => {
        const found = measurement.metData.find(m => m.compound === met.compound);
        return {
          x: mIdx * 2,
          y: found ? (found.log2fc || 0) : null
        };
      }).filter(p => p.y !== null);
      
      if(linePoints.length > 1){
        lineDatasets.push({
          type: 'line',
          data: linePoints,
          borderColor: 'rgba(138, 170, 160, 0.3)',
          borderWidth: 1,
          pointRadius: 0,
          pointHoverRadius: 0,
          fill: false,
          tension: 0,
          order: 2
        });
      }
    });
  }
  
  const allDatasets = [...lineDatasets, ...scatterDatasets];
  
  console.log('患者パネル散布図データ:');
  console.log('scatterDatasets:', scatterDatasets);
  scatterDatasets.forEach((ds, idx) => {
    console.log(`  データセット${idx}: pointRadius =`, ds.pointRadius);
  });
  
  patientMetaboliteScatterChart = new Chart(canvas, {
    type: 'scatter',
    data: { datasets: allDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          title: {
            display: true,
            text: '基準値からの乖離度（🔴高い / 🔵低い）',
            font: { size: 13, family: 'DM Sans', weight: '600' },
            color: '#2C4A40'
          },
          min: -12,
          max: 12,
          ticks: {
            font: { size: 11, family: 'DM Sans' },
            color: '#5A7A6E'
          },
          grid: { 
            color: (ctx) => ctx.tick.value === 0 ? '#2C4A40' : 'rgba(212, 230, 221, 0.6)',
            lineWidth: (ctx) => ctx.tick.value === 0 ? 3 : 1
          }
        },
        x: {
          title: {
            display: allMeasurementData.length > 1,
            text: '測定回',
            font: { size: 11, family: 'DM Sans' },
            color: '#5A7A6E'
          },
          min: -0.5,
          max: Math.max(0.5, (allMeasurementData.length - 1) * 2 + 0.5),
          ticks: {
            callback: function(value) {
              const mIdx = Math.round(value / 2);
              if(mIdx >= 0 && mIdx < allMeasurementData.length) {
                return allMeasurementData[mIdx].date;
              }
              return '';
            },
            font: { size: 10, family: 'DM Sans' },
            color: '#8FAAA0'
          },
          grid: { display: false }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(26, 60, 52, 0.95)',
          titleFont: { size: 13, family: 'DM Sans', weight: '600' },
          bodyFont: { size: 12, family: 'DM Sans' },
          padding: 12,
          filter: function(item) {
            return item.dataset.type === 'scatter';
          },
          callbacks: {
            title: (ctx) => ctx[0].raw.compound,
            label: (ctx) => [
              `乖離度: ${ctx.raw.y.toFixed(3)} ${ctx.raw.y > 0 ? '高い' : '低い'}`,
              `実測値: ${ctx.raw.sample.toFixed(2)}`,
              `基準値: ${ctx.raw.baseline.toFixed(2)}`,
              `重要度: ${ctx.raw.weight.toFixed(1)}`
            ]
          }
        }
      }
    }
  });
}


document.addEventListener('click', () => {
  document.querySelectorAll('.lang-dropdown').forEach(d => d.classList.remove('show'));
});

</script>
</body>
</html>
