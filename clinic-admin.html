<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaCheck — クリニック審査（事務局用）</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#ffffff; --ink-mid:#f4f7fb; --teal:#1b6b45; --teal-light:#2f8f5a;
    --off-white:#16243d; --muted:#5f7181; --border:rgba(22,36,61,0.08); --error:#c23b2f;
    --sf:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--off-white); font-family:var(--sf); min-height:100vh; display:flex; flex-direction:column; }
  nav { position:sticky; top:0; z-index:100; padding:14px 20px; background:rgba(15,46,32,0.94); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:9px; }
  .nav-brand { font-size:14px; font-weight:600; color:#f4f6fa; }
  .hero { padding:28px 20px; }
  .hero-title { font-family:'Playfair Display',serif; font-size:22px; font-weight:600; }
  .gate { max-width:340px; margin:80px auto; padding:0 20px; text-align:center; }
  .gate .nav-brand { margin-bottom:24px; color:var(--off-white); font-size:16px; }
  .gate input { width:100%; padding:12px 14px; background:var(--ink-mid); border:1.5px solid var(--border); border-radius:8px; color:var(--off-white); font-size:14px; margin-bottom:12px; }
  .gate button { width:100%; padding:12px; background:var(--teal); border:none; border-radius:100px; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; }
  .list { padding:0 20px 40px; display:flex; flex-direction:column; gap:10px; }
  .item-card { background:var(--ink-mid); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .item-org { font-size:15px; font-weight:700; margin-bottom:2px; }
  .item-email { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .item-meta { font-size:11.5px; color:var(--muted); margin-bottom:4px; }
  .item-date { font-size:11px; color:var(--muted); margin-bottom:10px; }
  .btn-row { display:flex; gap:8px; }
  .btn-approve { flex:1; padding:10px; background:var(--teal); border:none; border-radius:100px; color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; }
  .btn-reject { flex:1; padding:10px; background:transparent; border:1.5px solid var(--error); border-radius:100px; color:var(--error); font-size:13px; font-weight:600; cursor:pointer; }
  .status-tag { display:inline-block; font-size:10px; padding:3px 9px; border-radius:100px; font-weight:600; margin-bottom:8px; }
  .status-trial { background:rgba(27,107,69,0.15); color:var(--teal-light); }
  .status-active { background:rgba(27,107,69,0.15); color:var(--teal-light); }
  .status-rejected { background:rgba(229,114,107,0.15); color:var(--error); }
  .empty { color:var(--muted); font-size:13px; padding:20px; text-align:center; }
  .hidden { display:none !important; }
  .section-label { padding:20px 20px 10px; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="nav-brand">MetaCheck 事務局</div>
  <input type="password" id="admin-pw" placeholder="管理パスワード">
  <button onclick="checkPw()">入室</button>
</div>

<div id="admin-area" class="hidden">
  <nav><span class="nav-brand">MetaCheck 事務局</span></nav>
  <div class="hero"><div class="hero-title">クリニック 審査</div></div>

  <div class="section-label">審査待ち</div>
  <div class="list" id="pending-list"><p class="empty">読み込み中...</p></div>

  <div class="section-label">審査済み</div>
  <div class="list" id="done-list"><p class="empty">読み込み中...</p></div>
</div>

<script>
// ※ SUPABASE_URLとservice_roleキー(SRK)は、CPC BANK側のadmin.htmlと同じ値を
//   MetaCheck側の実際の値に置き換えて使ってください（同一プロジェクトであれば同じ値のはずです）。
const SUPABASE_URL = 'https://fmpetihjnsuogbvnfauc.supabase.co';
const ADMIN_PW = '0000'; // 必要に応じて別のパスワードに変更してください

function checkPw() {
  const pw = document.getElementById('admin-pw').value;
  if (pw === ADMIN_PW) {
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('admin-area').classList.remove('hidden');
    sessionStorage.setItem('metacheck_admin_pw', pw);
    loadClinics();
  } else {
    alert('パスワードが違います');
  }
}
if (sessionStorage.getItem('metacheck_admin_pw') === ADMIN_PW) {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('admin-area').classList.remove('hidden');
  loadClinics();
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
}

async function loadClinics() {
  const pendingEl = document.getElementById('pending-list');
  const doneEl = document.getElementById('done-list');
  const SRK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtcGV0aWhqbnN1b2didm5mYXVjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MTM1NzIwMSwiZXhwIjoyMDg2OTMzMjAxfQ.Bd0PsjWs0o6S-JTmAl2iiyyRJm2saxxk6jxtxg-j26U'; // CPC BANKと同一プロジェクトのservice_roleキー

  const res = await fetch(SUPABASE_URL + '/rest/v1/clinics?select=*&order=created_at.desc', {
    headers: { apikey: SRK, Authorization: 'Bearer ' + SRK }
  });
  const clinics = await res.json();
  if (!res.ok || !Array.isArray(clinics)) {
    pendingEl.innerHTML = '<p class="empty">エラー: ' + res.status + ' ' + JSON.stringify(clinics) + '</p>';
    return;
  }

  const pending = clinics.filter(c => c.status === 'pending');
  const done = clinics.filter(c => c.status !== 'pending');

  pendingEl.innerHTML = pending.length ? pending.map(c => `
    <div class="item-card">
      <div class="item-org">${c.name || '(クリニック名未設定)'}</div>
      <div class="item-email">${c.email || '(メール未取得)'}</div>
      <div class="item-meta">クリニックID: ${c.id}</div>
      <div class="item-date">登録日: ${fmtDate(c.created_at)}</div>
      <div class="btn-row">
        <button class="btn-approve" onclick="setStatus('${c.id}','trial')">承認する</button>
        <button class="btn-reject" onclick="setStatus('${c.id}','rejected')">却下する</button>
      </div>
    </div>
  `).join('') : '<p class="empty">審査待ちのクリニックはいません</p>';

  doneEl.innerHTML = done.length ? done.map(c => `
    <div class="item-card">
      <span class="status-tag status-${c.status}">${c.status === 'rejected' ? '却下' : (c.status === 'admin' ? '管理者' : '承認済み')}</span>
      <div class="item-org">${c.name || '(クリニック名未設定)'}</div>
      <div class="item-email">${c.email || '(メール未取得)'}</div>
      <div class="item-meta">クリニックID: ${c.id}</div>
    </div>
  `).join('') : '<p class="empty">審査済みのクリニックはいません</p>';
}

async function setStatus(clinicId, status) {
  const SRK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtcGV0aWhqbnN1b2didm5mYXVjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MTM1NzIwMSwiZXhwIjoyMDg2OTMzMjAxfQ.Bd0PsjWs0o6S-JTmAl2iiyyRJm2saxxk6jxtxg-j26U';
  await fetch(SUPABASE_URL + '/rest/v1/clinics?id=eq.' + clinicId, {
    method: 'PATCH',
    headers: {
      apikey: SRK, Authorization: 'Bearer ' + SRK,
      'Content-Type': 'application/json', Prefer: 'return=minimal'
    },
    body: JSON.stringify({ status: status })
  });
  loadClinics();
}
</script>
</body>
</html>
